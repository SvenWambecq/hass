title: Home
resources:
  - url: /local/power-flow-card.js
    type: module
  - url: /local/plotly-graph-card.js
    type: module
  - url: /local/apexcharts-card.js
    type: module
  - url: /local/button-card.js
    type: module
  - url: /local/slider-entity-row.js
    type: module
  - url: /local/mini-graph-card-bundle.js
    type: module
views:
  - path: default_view
    title: Home
    subview: false
    type: sidebar
    badges: []
    cards:
      - type: custom:power-flow-card
        watt_threshold: 10000
        inverted_entities: grid
        entities:
          battery: sensor.battery_power
          battery_charge: sensor.battery_state_of_charge
          solar: sensor.pv_power
          grid: sensor.on_grid_export_power
      - type: custom:apexcharts-card
        header:
          show: true
          title: Power
        graph_span: 24h
        update_interval: 2min
        apex_config:
          chart:
            zoom:
              enabled: true
              type: x
              autoScaleYaxis: true
            toolbar:
              show: true
              tools:
                selection: true
                zoom: true
                zoomin: true
                zoomout: true
                pan: true
                reset: true
        yaxis:
          - id: power
            min: -3000
            max: 6000
            decimals: 0
          - id: soc
            opposite: true
            min: -50
            max: 100
            decimals: 0
        series:
          - entity: sensor.pv_power
            name: PV
            yaxis_id: power
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 2min
          - entity: sensor.battery_power
            name: Battery
            yaxis_id: power
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 2min
          - entity: sensor.on_grid_export_power
            name: Grid
            yaxis_id: power
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 2min
          - entity: sensor.house_consumption
            name: Consumption
            yaxis_id: power
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 2min
          - entity: sensor.battery_state_of_charge
            name: SoC
            yaxis_id: soc
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 5min
      - type: gauge
        entity: sensor.current_average_demand
        name: Capaciteit
        unit: kW
        needle: true
        max: 5
        min: 0
        severity:
          green: 0
          yellow: 2
          red: 2.5
      - type: entities
        title: Gemiddeld verbruik
        entities:
          - entity: sensor.average_demand_last_hour
            name: Laatste uur
          - entity: sensor.average_demand_last_24_hours
            name: Laatste 24 uur
          - entity: sensor.average_demand_last_7_days
            name: Laatste 7 dagen
      - type: energy-date-selection
      - type: energy-distribution
        link_dashboard: true
      - type: energy-usage-graph
      - type: custom:apexcharts-card
        experimental:
          color_threshold: true
        header:
          show: true
          title: Kwartierverbuik
        graph_span: 24h
        update_interval: 15min
        yaxis:
          - min: 0
            decimals: 1
        apex_config:
          chart:
            toolbar:
              show: false
        series:
          - entity: sensor.current_average_demand
            name: Kwartierverbuik
            type: column
            group_by:
              func: max
              duration: 15min
            color_threshold:
              - value: 0
                color: "#00a000"
              - value: 2
                color: "#FFA500"
              - value: 2.5
                color: "#f00000"
          - entity: input_number.demand_peak_current_month
            name: Piek huidige maand
            type: line
            curve: stepline
            color: "#f00000"
            stroke_width: 2
            group_by:
              func: last
              duration: 15min
      - type: custom:apexcharts-card
        header:
          show: true
          title: Dagelijkse piek
        graph_span: 90d
        update_interval: 1h
        yaxis:
          - min: 0
            decimals: 1
        apex_config:
          chart:
            toolbar:
              show: false
        series:
          - entity: sensor.current_average_demand
            name: Dagelijkse piek
            type: column
            statistics:
              type: max
              period: day
            color_threshold:
              - value: 0
                color: "#00a000"
              - value: 2
                color: "#FFA500"
              - value: 2.5
                color: "#f00000"
      - type: entities
        title: Kwartierverbruik - maandpieken
        entities:
          - entity: input_number.demand_peak_two_months_ago
            name: M-2
          - entity: input_number.demand_peak_previous_month
            name: M-1
          - entity: input_number.demand_peak_current_month
            name: Huidige maand
          - entity: sensor.demand_tariff_max
            name: MAX (M-2, M-1, 2.5 kW)
          - entity: sensor.demand_global_max
            name: Globale max (3 maanden)
