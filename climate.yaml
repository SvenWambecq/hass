title: Klimaat
resources:
  - url: /local/apexcharts-card.js
    type: module
  - url: /local/mini-graph-card-bundle.js
    type: module
views:
  - path: default_view
    title: Ventilatie
    subview: false
    type: sidebar
    badges: []
    cards:
      - type: tile
        entity: fan.thuis_ventilatie
        name: Ventilatie
        features:
          - type: fan-preset-modes
      - type: entities
        title: Bediening
        entities:
          - entity: select.thuis_ventilatie_ventilation_state
            name: Ventilatiestand
          - entity: sensor.thuis_ventilatie_ventilatiestatus
            name: Status
          - entity: sensor.thuis_ventilatie_state_end_time
            name: Status eindtijd
          - entity: sensor.thuis_ventilatie_target_flow_level
            name: Doeldebiet
      - type: custom:apexcharts-card
        header:
          show: true
          title: Dagelijkse gemiddelde luchtvochtigheid
        graph_span: 90d
        update_interval: 1h
        yaxis:
          - decimals: 0
            min: 0
            max: 100
        series:
          - entity: sensor.node_2_luchtvochtigheid
            name: Binnen
            statistics:
              type: mean
              period: day
          - entity: sensor.sluispark_humidity_statistics
            name: Buiten
            statistics:
              type: mean
              period: day
      - type: grid
        title: Temperaturen
        columns: 4
        square: false
        cards:
          - type: tile
            entity: sensor.thuis_ventilatie_outdoor_air_temperature
            name: Buitenlucht
            color: blue
          - type: tile
            entity: sensor.thuis_ventilatie_supply_air_temperature
            name: Toevoerlucht
            color: green
          - type: tile
            entity: sensor.thuis_ventilatie_extract_air_temperature
            name: Afvoerlucht
            color: orange
          - type: tile
            entity: sensor.thuis_ventilatie_exhaust_air_temperature
            name: Uitblaaslucht
            color: red
      - type: custom:apexcharts-card
        header:
          show: true
          title: Luchttemperaturen
        graph_span: 24h
        update_interval: 5min
        apex_config:
          chart:
            zoom:
              enabled: true
              type: x
              autoScaleYaxis: true
            toolbar:
              show: true
              tools:
                selection: true
                zoom: true
                zoomin: true
                zoomout: true
                pan: true
                reset: true
        yaxis:
          - decimals: 1
        series:
          - entity: sensor.thuis_ventilatie_outdoor_air_temperature
            name: Buitenlucht
            color: blue
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.thuis_ventilatie_supply_air_temperature
            name: Toevoerlucht
            color: green
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.thuis_ventilatie_extract_air_temperature
            name: Afvoerlucht
            color: orange
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 5min
          - entity: sensor.thuis_ventilatie_exhaust_air_temperature
            name: Uitblaaslucht
            color: red
            curve: smooth
            stroke_width: 1.5
            group_by:
              func: avg
              duration: 5min
      - type: horizontal-stack
        cards:
          - type: gauge
            entity: sensor.thuis_ventilatie_target_flow_level
            name: Doeldebiet
            unit: "%"
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 60
              red: 90
          - type: gauge
            entity: sensor.thuis_ventilatie_filter_remaining
            name: Filter resterend
            unit: d
            min: 0
            max: 365
            severity:
              red: 0
              yellow: 30
              green: 60
      - type: entities
        title: Luchtvochtigheid
        entities:
          - entity: sensor.node_2_luchtvochtigheid
            name: Luchtvochtigheid
